    <style>
:root {

.brand { display: inline-flex; gap: .68rem; align-items: center; text-decoration: none; width: fit-content; }
.brand-name { display: block; font-size: 1.07rem; font-weight: 800; line-height: 1.15; letter-spacing: -.045em; }
.brand-group { display: block; font-size: .72rem; line-height: 1.4; color: var(--muted); }
.mark { position: relative; width: 2.45rem; height: 2.45rem; border-radius: .82rem; background: var(--forest); display: grid; place-items: center; flex: none; }
.mark::before { content: ""; width: .93rem; height: .93rem; transform: rotate(45deg); border: 2px solid var(--lime); border-radius: .17rem; }

.auth-shell { min-height: 100svh; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); }

  content: "";
  z-index: -1;

  inset: -15% -20% -40% 12%;

  transform: rotate(-18deg);
  pointer-events: none;
}
.auth-story { display: flex; flex-direction: column; justify-content: space-between; gap: 3rem; padding: clamp(2rem, 6vw, 6rem); min-height: 38rem; background: linear-gradient(155deg, #173f34 18%, #0b2821 100%); }
.auth-story .brand-group { color: #c4d7c9; }
.auth-story .mark { background: #f5f9e9; }
.auth-story .mark::before { border-color: var(--forest); }
.auth-story .mark::after { background: var(--forest); }
.story-copy { max-width: 36rem; }
.story-copy .eyebrow { color: var(--lime); margin-bottom: 1rem; }
.story-copy h1 { font-size: clamp(3.1rem, 7vw, 6.3rem); line-height: .98; letter-spacing: -.08em; overflow-wrap: anywhere; }
.story-copy p:last-child { max-width: 29rem; margin-top: 1.4rem; color: #d4e3d7; font-size: clamp(1rem, 1.8vw, 1.25rem); }
.auth-story .story-copy { margin-block: auto; }
.auth-panel { padding: clamp(1.25rem, 5vw, 5rem); display: grid; place-items: center; background: #fafbf7; }
.auth-box { width: min(100%, 27rem); }
.auth-box h2 { font-size: clamp(1.9rem, 3.3vw, 2.65rem); margin-bottom: .45rem; }
.auth-switch, .segmented { display: flex; flex-wrap: wrap; gap: .35rem; padding: .3rem; border-radius: .85rem; background: var(--mint); width: fit-content; margin: 1.15rem 0; }
.auth-switch { width: 100%; }
.auth-switch button { flex: 1; }
.auth-switch button, .segmented button, .segmented a { border: 0; border-radius: .6rem; background: transparent; padding: .52rem .85rem; color: var(--muted); font-weight: 650; font-size: .92rem; text-decoration: none; }
.auth-switch button[aria-pressed="true"], .segmented button[aria-pressed="true"] { background: var(--surface); color: var(--forest); box-shadow: 0 1px 4px #1e403115; }
.auth-box form { margin-top: 1.15rem; }
.auth-box form .button { width: 100%; }
.auth-link { margin-top: 1.25rem; }

.button { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; border: 1px solid transparent; border-radius: .78rem; min-height: 2.7rem; padding: .58rem 1rem; font-weight: 750; text-decoration: none; line-height: 1.25; width: fit-content; }
.button.primary { color: #fff; background: var(--forest); }
.button.primary:hover:not(:disabled) { background: #245642; }
.button.secondary { color: var(--forest); background: #fff; border-color: var(--line); }
.button.secondary:hover:not(:disabled) { background: var(--mint); }
.button.accent { color: #203a26; background: var(--lime); }
.button.accent:hover { background: #ecf6c7; }
.button:disabled { opacity: .57; }
.link-button { border: 0; background: transparent; padding: .25rem 0; text-decoration: underline; text-underline-offset: .2em; font-weight: 700; color: var(--forest); }
.form { display: grid; gap: .9rem; }
.field { display: grid; gap: .28rem; min-width: 0; }
.field label, .field > span { font-weight: 700; font-size: .86rem; }
input:not([type="checkbox"]), select, textarea { width: 100%; min-width: 0; padding: .57rem .73rem; min-height: 2.7rem; color: var(--ink); background: #fff; border: 1px solid #cddbcf; border-radius: .66rem; }
input::placeholder, textarea::placeholder { color: #63736a; }
textarea { min-height: 5.1rem; resize: vertical; }
select:disabled, textarea:disabled, input:disabled { background: #f0f4ef; opacity: .7; }
.form-error { color: var(--error); background: #fff0ed; border-radius: .65rem; padding: .56rem .75rem; font-size: .9rem; }
.form-columns { display: grid; gap: .8rem; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form-actions { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }

.topbar { background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-inner { min-height: 4.65rem; max-width: 1260px; margin: 0 auto; padding: .65rem clamp(1rem, 3vw, 2rem); display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.main-nav { display: flex; gap: .15rem; align-items: center; overflow-x: auto; }
.main-nav a { padding: .5rem .72rem; border-radius: .62rem; text-decoration: none; font-size: .88rem; color: var(--muted); font-weight: 700; white-space: nowrap; }
.main-nav a[aria-current="page"] { color: var(--forest); background: var(--mint); }
.main-nav a:hover { color: var(--forest); background: #f0f5ef; }
.account { display: flex; align-items: center; gap: .65rem; }
.account span { max-width: 10rem; overflow-wrap: anywhere; font-size: .88rem; font-weight: 750; }
.account .button { min-height: 2.15rem; padding: .35rem .6rem; font-size: .8rem; }
.view-controls { display: flex; align-items: center; flex-wrap: wrap; gap: .5rem; }
.view-controls > .button { min-height: 2.15rem; padding: .35rem .65rem; font-size: .8rem; }
.local-account { display: flex; align-items: center; gap: .48rem; }
.local-account label { color: var(--muted); font-size: .78rem; font-weight: 750; white-space: nowrap; }
.local-account select { width: clamp(7rem, 14vw, 12rem); min-height: 2.15rem; padding: .35rem .46rem; font-size: .84rem; }
.local-warning { border-radius: .8rem; background: #f7edca; color: #65450e; padding: .65rem .85rem; }
.workspace { max-width: 1210px; margin: 0 auto; padding: 2rem clamp(1rem, 3vw, 2rem) 3rem; display: grid; gap: 1.2rem; }
.page-head { display: flex; justify-content: space-between; align-items: end; gap: .9rem; flex-wrap: wrap; margin-bottom: .2rem; }
.page-head h1 { font-size: clamp(1.9rem, 4vw, 3rem); margin-bottom: .3rem; }

.hero { border-radius: var(--radius); background: linear-gradient(120deg, #163d31 20%, #23503f 100%); padding: clamp(1.2rem, 4vw, 2.6rem); min-height: 15rem; }
.hero::before { inset: -90% -15% -115% 36%; }
.hero-content { max-width: 42rem; display: grid; justify-items: start; gap: .8rem; }
.hero h1 { font-size: clamp(2rem, 5vw, 3.55rem); letter-spacing: -.06em; }
.hero p { max-width: 37rem; color: #e0ecdf; font-size: 1.04rem; }
.hero .button { margin-top: .2rem; }
.hero-meta, .round-meta { display: flex; gap: .55rem; align-items: center; flex-wrap: wrap; }
.hero-meta { color: #e1ebda; }
.pill { display: inline-flex; align-items: center; width: fit-content; border-radius: 99px; background: #eef2ee; color: #46584c; padding: .24rem .61rem; font-size: .76rem; font-weight: 750; line-height: 1.35; }
.pill.open { color: #22452e; background: #e0efcb; }
.pill.scoring { color: #73470b; background: #f7edca; }
.pill.closed { color: #364b62; background: #e7eef4; }
.hero .pill.planned { color: #edf5e8; background: #ffffff21; }
.card { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(1rem, 2.3vw, 1.5rem); }
.card h2 { font-size: 1.23rem; }
.card-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .65rem; margin-bottom: .9rem; }
.stat-grid, .round-grid { display: grid; gap: .9rem; }
.stat-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stat { display: grid; gap: .35rem; }
.stat strong { font-size: clamp(1.6rem, 4vw, 2.15rem); line-height: 1; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: .87rem; }
.round-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.round-card { display: grid; align-content: start; gap: .75rem; }
.round-card .card-head { margin-bottom: 0; }
.round-card .button { margin-top: .25rem; }
.round-date { color: var(--muted); font-size: .84rem; }
.round-card .round-meta { min-height: 1.65rem; }
.empty { padding: .9rem 0; color: var(--muted); }

.leader-list, .person-list, .rule-list, .checklist { list-style: none; margin: 0; padding: 0; }
.leader-list li { display: grid; grid-template-columns: 1.85rem minmax(0, 1fr) auto; gap: .65rem; padding: .68rem 0; align-items: center; border-top: 1px solid #eaf0e9; }
.leader-list li:first-child { border-top: 0; }
.rank { color: #4e634e; font-weight: 800; font-size: .94rem; text-align: center; }
.person-line { display: flex; align-items: center; gap: .6rem; min-width: 0; }
.avatar { display: grid; place-items: center; width: 2.25rem; height: 2.25rem; flex: none; border-radius: .7rem; background: #eaf1e2; color: #325640; font-size: .79rem; font-weight: 850; text-transform: uppercase; }
.person-copy { min-width: 0; overflow-wrap: anywhere; }
.person-copy strong, .person-copy small { display: block; }
.person-copy strong { line-height: 1.24; }
.person-copy small { color: var(--muted); font-size: .77rem; margin-top: .15rem; }
.points { font-weight: 850; font-variant-numeric: tabular-nums; white-space: nowrap; }
.person-list { display: grid; gap: .45rem; }
.person-list li { display: flex; justify-content: space-between; align-items: center; gap: .6rem; background: #f5f8f3; border-radius: .78rem; padding: .54rem .64rem; }
.person-slot { color: var(--muted); white-space: nowrap; font-size: .77rem; }
.table-card { padding: 0; overflow: hidden; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; text-align: left; }
th, td { padding: .76rem .8rem; border-bottom: 1px solid #eaf0e9; }
thead { color: #3e5748; background: #eef4ec; white-space: nowrap; }
thead th { font-size: .79rem; }
tbody tr:last-child > * { border-bottom: 0; }
td.num, th.num { text-align: right; white-space: nowrap; }
tbody .active-row { background: #f3f7ee; }
tbody th { font-size: .95rem; font-weight: 700; }
.table-card .empty { padding: 1rem 1.5rem; }
.market-controls { display: flex; align-items: end; flex-wrap: wrap; gap: .75rem 1rem; padding: 1rem; }
.market-controls .field { flex: 1 1 10rem; max-width: 23rem; }
.market-places { display: grid; gap: .2rem; margin-left: auto; }
.market-places small { font-size: .8rem; color: var(--muted); }
.market-table thead th:first-child { width: 45%; }
.market-value { color: var(--forest); font-weight: 800; }
.market-mobile-label { display: none; }
.market-action { text-align: right; }
.market-action .button { min-height: 2.35rem; padding: .36rem .75rem; font-size: .85rem; }
.market-action .form-error { margin-top: .4rem; text-align: left; white-space: normal; }
.monitor-value-editor { margin-top: .2rem; white-space: normal; text-align: left; }
.monitor-value-editor summary { width: fit-content; margin-left: auto; cursor: pointer; color: var(--forest); font-size: .8rem; font-weight: 700; }
.monitor-value-editor form { gap: .55rem; margin-top: .6rem; min-width: 9.5rem; }

.rules-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .8rem; }
.rule-list li { padding: .65rem 0; border-top: 1px solid #e8efe7; display: grid; grid-template-columns: 1fr auto; gap: .22rem .5rem; align-items: start; }
.rule-list li:first-child { border-top: 0; }
.rule-list li small { grid-column: 1; color: var(--muted); }
.rule-list li .pill { grid-column: 2; grid-row: 1 / span 2; }
.section-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .85rem; }
.manage-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .85fr); gap: .9rem; align-items: start; }
.manage-grid > .card { display: grid; align-content: start; gap: .65rem; }
.checklist { display: grid; gap: .4rem; }
.check-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .6rem; padding: .55rem .6rem; border: 1px solid var(--line); border-radius: .72rem; }
.check-row input { width: 1.13rem; height: 1.13rem; accent-color: var(--forest); margin: 0; }
.check-row span small { display: block; color: var(--muted); font-size: .77rem; }
.check-row:has(input:checked) { background: #eff6e7; }
.notice { position: fixed; z-index: 4; right: 1rem; bottom: 1rem; max-width: min(27rem, calc(100% - 2rem)); padding: .7rem 1rem; border-radius: .75rem; background: var(--forest-dark); color: white; box-shadow: 0 5px 15px #0c29233b; }
.notice.error { background: #843e34; }
.footer { max-width: 1210px; margin: 0 auto; padding: 0 2rem 1.5rem; color: var(--muted); font-size: .8rem; }

.manager-view {
  color-scheme: dark;
  --ink: #eff5f1;
  --muted: #a7bbb2;
  --surface: #151f1d;
  --line: #31423d;
  --mint: #243630;
  min-height: 100svh;
  color: var(--ink);
  background: #0b1312;
}
.manager-view .topbar-inner, .manager-view .workspace { max-width: 52rem; }
.manager-view .page-head > div { min-width: 0; overflow-wrap: anywhere; }
.manager-view .brand-group { color: var(--muted); }
.manager-view .main-nav a[aria-current="page"] { color: var(--lime); background: var(--mint); }
.manager-view .main-nav a:hover { color: var(--ink); background: var(--mint); }
.manager-view .button.secondary { color: var(--ink); background: var(--surface); }
.manager-view .button.secondary:hover:not(:disabled) { background: var(--mint); }
.manager-view .button.primary { color: #203a26; background: var(--lime); }
.manager-view .button.primary:hover:not(:disabled) { background: #ecf6c7; }
.manager-view :is(input:not([type="checkbox"]), select, textarea) {
  color: var(--ink);
  background: #1b2925;
  border-color: var(--line);
}
.manager-view input::placeholder, .manager-view textarea::placeholder { color: var(--muted); }
.manager-view .form-error { background: #4b2825; color: #ffe0d8; }
.manager-view .check-row:has(input:checked), .manager-view tbody .active-row { background: #22382e; }
.manager-view :is(th, td) { border-color: var(--line); }
.manager-view thead { color: #d2e0da; background: #24342f; }
.manager-view .rank, .manager-view .market-value { color: var(--lime); }
.manager-view .avatar { background: #304940; color: #e2f0da; }

.lineup-stats {
  display: grid;
  grid-template-columns: .85fr 1.35fr 1fr;
  margin: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 1rem;
}
.lineup-stats > div { min-width: 0; padding: .72rem clamp(.55rem, 2vw, 1rem); }
.lineup-stats > div + div { border-inline-start: 1px solid var(--line); }
.lineup-stats dt { color: var(--muted); font-size: .74rem; font-weight: 650; }
.lineup-stats dd {
  margin: .18rem 0 0;
  font-size: clamp(.95rem, 3.8vw, 1.28rem);
  font-weight: 850;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.lineup-content { min-width: 0; display: grid; gap: .85rem; }
.lineup-toolbar { display: flex; align-items: end; justify-content: space-between; gap: .7rem; flex-wrap: wrap; }
.lineup-toolbar .field { flex: 1 1 13rem; max-width: 22rem; }
.lineup-toolbar .hint, .lineup-toolbar .round-meta { margin-block: .35rem; }
.lineup-pitch {
  --pitch-line: #abc9bb72;
  position: relative;
  isolation: isolate;
  min-height: 25rem;
  display: grid;
  align-content: space-around;
  gap: clamp(.62rem, 2vw, 1.15rem);
  padding: clamp(1.1rem, 3vw, 2rem);
  border: 1px solid #3a5a4e;
  border-radius: 1rem;
  background: repeating-linear-gradient(0deg, #adc8a907 0 3.5rem, transparent 3.5rem 7rem),
    linear-gradient(160deg, #1b392f, #11251f 82%);
}
.pitch-lines { position: absolute; inset: .68rem; border: 1px solid var(--pitch-line); border-radius: .3rem; pointer-events: none; }
.pitch-area { position: absolute; left: 22%; width: 56%; height: 15%; border: 1px solid var(--pitch-line); }
.pitch-area::after { content: ""; position: absolute; inset-inline: 25%; height: 46%; border: 1px solid var(--pitch-line); }
.pitch-area.top { top: -1px; border-top: 0; }
.pitch-area.top::after { top: 0; border-top: 0; }
.pitch-area.bottom { bottom: -1px; border-bottom: 0; }
.pitch-area.bottom::after { bottom: 0; border-bottom: 0; }
.pitch-middle { position: absolute; inset-inline: 0; top: 50%; border-top: 1px solid var(--pitch-line); }
.pitch-middle::after {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  width: min(27%, 7.5rem);
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  border: 1px solid var(--pitch-line);
  border-radius: 50%;
}
.pitch-row { position: relative; display: flex; justify-content: center; gap: clamp(.38rem, 2vw, 1.25rem); list-style: none; margin: 0; padding: 0; }
.pitch-slot {
  flex: 0 1 6.7rem;
  min-width: 0;
  display: grid;
  grid-template-rows: auto 1fr;
  overflow: hidden;
  border: 1px solid #719688;
  border-radius: .62rem;
  background: #e0eee5;
  box-shadow: 0 .3rem .75rem #0814108a;
  text-align: center;
}
.pitch-avatar {
  min-height: clamp(2.75rem, 10vw, 3.9rem);
  display: grid;
  place-content: center;
  color: #e6f6e8;
  background: linear-gradient(145deg, #365c4b, #243e37);
  font-size: clamp(1rem, 4vw, 1.4rem);
  font-weight: 850;
  line-height: 1.2;
  text-transform: uppercase;
}
.pitch-score { margin-top: .18rem; color: var(--lime); font-size: .7rem; text-transform: none; }
.pitch-name {
  min-height: 2.3rem;
  display: grid;
  place-items: center;
  padding: .25rem .28rem;
  color: #18372c;
  font-size: clamp(.67rem, 2.2vw, .85rem);
  line-height: 1.14;
  overflow-wrap: anywhere;
}
.pitch-slot.vacant {
  place-content: center;
  min-height: clamp(5.05rem, 13vw, 6.2rem);
  border-style: dashed;
  background: #122a23cf;
  color: #c2d7ca;
  box-shadow: none;
}
.pitch-slot.vacant span { font-size: 1.2rem; line-height: 1; }
.pitch-slot.vacant small { margin-top: .25rem; font-size: .72rem; }
.pitch-empty { position: relative; padding: 1rem; text-align: center; }

@media (max-width: 930px) {

  .main-nav { order: 3; width: 100%; }

  .manage-grid { grid-template-columns: 1fr; }

  .auth-shell, .round-grid, .section-grid, .rules-grid { grid-template-columns: 1fr; }
  .auth-story { min-height: 0; padding: 1.3rem 1.1rem 1.5rem; gap: 1.55rem; }
  .story-copy .eyebrow { margin-bottom: .35rem; }
  .story-copy p:last-child { margin-top: .5rem; }
  .auth-panel { padding: 1.4rem 1rem 2rem; }
  .workspace { padding-top: 1rem; gap: .85rem; }
  .stat-grid { gap: .4rem; }
  .stat { padding: .65rem .5rem; border-radius: .85rem; }
  .stat span { font-size: .73rem; line-height: 1.22; }

  <body>
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <div id="app">
      <main class="loading" id="main" tabindex="-1">
        <h1>FantasyScout</h1>
        <p>Descarga este HTML y ábrelo directamente en el navegador para usar FantasyScout.</p>
      </main>
    </div>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <noscript>Activa JavaScript para entrar en la liga.</noscript>
    <script>
(() => {
  "use strict";
const CONTRIBUTIONS = [
  { id: "task", label: "Tarea acordada", points: 3, description: "Preparar una actividad, coordinar una salida o dejar listo el material." },
  { id: "help", label: "Apoyo", points: 2, description: "Ayudar a otro monitor con una tarea concreta." },
  { id: "challenge", label: "Reto común", points: 2, description: "Completar el reto anunciado para la semana." },
  { id: "improvement", label: "Mejora", points: 1, description: "Proponer una mejora que el equipo ponga en práctica." },
];

const STARTER_CHALLENGES = [
  "Dejar por escrito un juego breve que otra sección pueda adaptar.",
  "Preparar una variante de una actividad para un día de lluvia.",
  "Adaptar un juego para que alguien que se incorpora por primera vez pueda participar.",
  "Probar una dinámica prestada de otra sección y contarle cómo salió.",
];

const DEFAULT_ROSTER_SIZE = 5;
const MAX_ROSTER_SIZE = 30;
const DEFAULT_MARKET_VALUE_CENTS = 100_000;
const MARKET_VALUE_ERROR = "Introduce un valor en euros igual o superior a cero, con hasta dos decimales.";

function validRosterSize(size) {
  return Number.isInteger(size) && size >= 1 && size <= MAX_ROSTER_SIZE;
}

function validMarketValue(cents) {
  return Number.isSafeInteger(cents) && cents >= 0;
}

function contributionMask(categories) {
  if (!Array.isArray(categories)) return null;

  let mask = 0;
  for (const category of categories) {
    const index = CONTRIBUTIONS.findIndex(({ id }) => id === category);
    if (index < 0) return null;
    mask |= 1 << index;
  }
  return mask;
}

function pointsFor(mask) {
  return CONTRIBUTIONS.reduce((points, category, index) => {
    return points + (mask & (1 << index) ? category.points : 0);
  }, 0);
}

function rosterProblem(monitorIds, monitors, size) {
  if (!Array.isArray(monitorIds)) return "Elige los monitores de tu equipo.";
  if (monitorIds.length > size) return `Tu plantilla admite hasta ${size} monitores.`;
  if (new Set(monitorIds).size !== monitorIds.length) return "Cada monitor ocupa una plaza en tu equipo.";
  const available = new Set(monitors.map(({ id }) => id));
  if (!monitorIds.every((id) => available.has(id))) return "Selecciona monitores registrados en la liga.";
  return null;
}

function rosterAfterTransfer(currentIds, monitors, size, monitorId, action) {
  if (action !== "sign" && action !== "release") return { problem: "Elige fichar o liberar al monitor." };
  if (!monitors.some(({ id }) => id === monitorId)) return { problem: "El monitor no está registrado en la liga." };
  const monitorIds = action === "sign"
    ? [...new Set([...currentIds, monitorId])]
    : currentIds.filter((id) => id !== monitorId);
  return { monitorIds, problem: rosterProblem(monitorIds, monitors, size) };
}

const TRANSITIONS = {
  open: { from: "planned", to: "open" },
  lock: { from: "open", to: "scoring" },
  close: { from: "scoring", to: "closed" },
  reopen: { from: "closed", to: "scoring" },
};

function nextRoundStatus(status, action) {
  const transition = Object.hasOwn(TRANSITIONS, action) ? TRANSITIONS[action] : null;
  if (!transition || (transition.from !== status && transition.to !== status)) return null;
  return transition.to;
}

function indexByRound(rounds, entries, key, valueFor) {
  const index = new Map(rounds.map(({ id }) => [id, new Map()]));
  for (const entry of entries) {
    index.get(entry.roundId)?.set(entry[key], valueFor(entry));
  }
  return index;
}

function calculateStandings(players, rounds, scores, roundRosters) {
  const pointsByRound = indexByRound(rounds, scores, "monitorId", ({ mask }) => pointsFor(mask));
  const rostersByRound = indexByRound(rounds, roundRosters, "playerId", ({ monitorIds }) => monitorIds);
  const rows = players.map(({ id, alias, team, sectionId }) => {
    let total = 0;
    const results = rounds.map((round) => {
      const points = pointsByRound.get(round.id);
      const members = rostersByRound.get(round.id).get(id) ?? [];
      const weekly = members.reduce((sum, monitorId) => sum + (points.get(monitorId) ?? 0), 0);
      total += weekly;
      return {
        roundId: round.id,
        total: weekly,
        scored: points.size > 0 || round.status === "closed",
      };
    });
    return { id, alias, team, sectionId, total, results };
  });

  rows.sort((a, b) => b.total - a.total ||
    a.team.localeCompare(b.team, "es") || a.alias.localeCompare(b.alias, "es") || a.id - b.id);

  let rank = 0;
  return rows.map((row, index) => {
    const previous = rows[index - 1];
    if (!previous || row.total !== previous.total) rank = index + 1;
    return { ...row, rank };
  });
}

function convertLegacyGame({ players, rounds, lineups, scores }) {
  const latest = new Map();
  const frozen = new Set(rounds.filter(({ status }) => status === "scoring" || status === "closed").map(({ id }) => id));
  const roundRosters = [];
  for (const { playerId, roundId, firstPickId, secondPickId } of [...lineups].sort((a, b) => a.roundId - b.roundId)) {
    const monitorIds = [firstPickId, secondPickId];
    latest.set(playerId, { playerId, monitorIds });
    if (frozen.has(roundId)) roundRosters.push({ roundId, playerId, monitorIds });
  }
  return {
    monitors: players.map(({ id, alias, sectionId }) => ({ id, name: alias, sectionId })),
    rosterSize: DEFAULT_ROSTER_SIZE,
    rosters: [...latest.values()],
    roundRosters,
    scores: scores.map(({ playerId, ...score }) => ({ ...score, monitorId: playerId })),
  };
}

function leagueView(snapshot, actor) {
  const { sections, players, monitors, rounds, rosterSize, rosters, roundRosters, scores } = snapshot;
  const publicSections = sections.map(({ id, name }) => ({ id, name }));
  const player = actor && players.find(({ id }) => id === actor.playerId);
  if (!actor || (!actor.isAdmin && !player && !actor.isPreview)) return { viewer: null, sections: publicSections };

  const reviewIds = sections.filter(({ reviewerId }) => actor.isAdmin || (player && reviewerId === player.id))
    .map(({ id }) => id);
  const reviewable = new Set(reviewIds);
  const monitorSections = new Map(monitors.map(({ id, sectionId }) => [id, sectionId]));
  const viewer = actor.isAdmin ? { role: "admin", reviewIds }
    : player ? { role: "player", player, reviewIds } : { role: "preview", reviewIds };
  return {
    viewer,
    sections: actor.isAdmin ? sections : publicSections,
    players,
    monitors,
    defaultMarketValueCents: DEFAULT_MARKET_VALUE_CENTS,
    rounds,
    rosterSize,
    rosterLimit: MAX_ROSTER_SIZE,
    contributions: CONTRIBUTIONS,
    standings: calculateStandings(players, rounds, scores, roundRosters),
    roster: rosters.find(({ playerId }) => playerId === player?.id)?.monitorIds ?? [],
    weeklyRosters: roundRosters.filter(({ playerId }) => playerId === player?.id),
    monitorPoints: scores.map(({ roundId, monitorId, mask }) => ({ roundId, monitorId, points: pointsFor(mask) })),
    reviewScores: scores.filter(({ monitorId }) => reviewable.has(monitorSections.get(monitorId))),
  };
}


const LOCAL_KEY = "fantasyscout-108-local-v1";
const LOCAL_FORMAT = "fantasyscout-108";
const MONITOR_REGISTER_FORMAT = "fantasyscout-monitores";
const LOCAL_STATUSES = new Set(["planned", "open", "scoring", "closed"]);
const UNSAVED = "El navegador limita el guardado local. Abre el HTML descargado directamente en tu navegador para llevar la liga. Descarga una copia desde Monitores o Gestión para conservar los cambios de esta sesión.";
const UNREADABLE = "La liga guardada no se pudo leer. Puedes recuperar los datos importando una copia desde Gestión.";
const localKey = (value) => value.normalize("NFKC").toLocaleLowerCase("es");
const validLocalId = (value) => Number.isSafeInteger(value) && value > 0;
const hasUnique = (rows, key) => new Set(rows.map(key)).size === rows.length;
const weeklyRosterKey = ({ roundId, playerId }) => `${roundId}/${playerId}`;
const weeklyScoreKey = ({ roundId, monitorId }) => `${roundId}/${monitorId}`;
const isFixed = (status) => status === "scoring" || status === "closed";

function localError(message, status = 400) {
  return Object.assign(new Error(message), { status });
}

function localText(value, label, max, optional = false) {
  const text = typeof value === "string" ? value.trim().normalize("NFC") : "";
  if (typeof value !== "string" || (!text && !optional) || text.length > max || text.includes("\0")) {
    throw localError(`Revisa ${label}. El máximo es de ${max} caracteres.`);
  }
  return text;
}

function localDate(value) {
  if (value === null || value === "") return null;
  if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) {
    throw localError("Introduce una fecha válida.");
  }
  const date = new Date(`${value}T12:00:00Z`);
  if (!Number.isFinite(date.getTime()) || date.toISOString().slice(0, 10) !== value) {
    throw localError("Introduce una fecha válida.");
  }
  return value;
}

function newLocalLeague() {
  return {
    format: LOCAL_FORMAT,
    version: 2,
    sections: [{ id: 1, name: "Tropa Jungla", reviewerId: null }],
    players: [],
    rounds: STARTER_CHALLENGES.map((challenge, index) => ({ id: index + 1, challenge, date: null, status: "planned" })),
    monitors: [],
    rosterSize: DEFAULT_ROSTER_SIZE,
    rosters: [],
    roundRosters: [],
    scores: [],
  };
}

function normalizeCopy(serialized) {
  const invalid = () => localError("El archivo no contiene una copia válida de FantasyScout.");
  let data;
  try {
    data = JSON.parse(serialized);
  } catch {
    throw invalid();
  }
  if (data?.format !== LOCAL_FORMAT || ![1, 2].includes(data.version)) throw invalid();
  const gameLists = data.version === 1 ? ["lineups"] : ["monitors", "rosters", "roundRosters"];
  if (!["sections", "players", "rounds", "scores", ...gameLists].every((name) =>
        Array.isArray(data[name]) && data[name].every((row) => row && typeof row === "object"))) {
    throw invalid();
  }
  if (data.version === 1) data = { ...data, ...convertLegacyGame(data), version: 2 };

  const sections = data.sections.map(({ id, name, reviewerId }) => ({
    id, name: localText(name, "el nombre de la sección", 60), reviewerId,
  }));
  const players = data.players.map(({ id, alias, team, sectionId }) => ({
    id, alias: localText(alias, "el alias", 32), team: localText(team, "el nombre del equipo", 52), sectionId,
  }));
  const rounds = data.rounds.map(({ id, challenge, date, status }) => ({
    id, challenge: localText(challenge, "el reto", 280, true), date: localDate(date), status,
  })).sort((a, b) => a.id - b.id);
  const monitors = data.monitors.map(({ id, name, sectionId, marketValueCents = DEFAULT_MARKET_VALUE_CENTS }) => ({
    id, name: localText(name, "el nombre del monitor", 60), sectionId, marketValueCents,
  }));
  const rosterSize = data.rosterSize;
  const rosters = data.rosters.map(({ playerId, monitorIds }) => ({ playerId, monitorIds }));
  const roundRosters = data.roundRosters.map(({ roundId, playerId, monitorIds }) => ({ roundId, playerId, monitorIds }));
  const scores = data.scores.map(({ roundId, monitorId, mask, note }) =>
    ({ roundId, monitorId, mask, note: localText(note, "la nota", 280, true) }));
  const sectionById = new Map(sections.map((section) => [section.id, section]));
  const playerById = new Map(players.map((player) => [player.id, player]));
  const roundById = new Map(rounds.map((round) => [round.id, round]));
  const monitorById = new Map(monitors.map((monitor) => [monitor.id, monitor]));

  if (!sections.length || !hasUnique(sections, ({ name }) => localKey(name)) ||
      sectionById.size !== sections.length || !sections.every(({ id, reviewerId }) =>
        validLocalId(id) && (reviewerId === null || playerById.get(reviewerId)?.sectionId === id)) ||
      playerById.size !== players.length || !hasUnique(players, ({ alias }) => localKey(alias)) ||
      !players.every(({ id, sectionId }) => validLocalId(id) && sectionById.has(sectionId)) ||
      monitorById.size !== monitors.length ||
      !hasUnique(monitors, ({ name, sectionId }) => `${sectionId}/${localKey(name)}`) ||
      !monitors.every(({ id, sectionId, marketValueCents }) =>
        validLocalId(id) && sectionById.has(sectionId) && validMarketValue(marketValueCents)) ||
      !validRosterSize(rosterSize) || !rounds.length ||
      !rounds.every(({ id, status }, index) => id === index + 1 && LOCAL_STATUSES.has(status))) {
    throw invalid();
  }
  if (!hasUnique(rosters, ({ playerId }) => playerId) || !rosters.every(({ playerId, monitorIds }) =>
    playerById.has(playerId) && !rosterProblem(monitorIds, monitors, rosterSize))) throw invalid();
  if (!hasUnique(roundRosters, weeklyRosterKey) || !roundRosters.every(({ roundId, playerId, monitorIds }) =>
    isFixed(roundById.get(roundId)?.status) && playerById.has(playerId) &&
    !rosterProblem(monitorIds, monitors, MAX_ROSTER_SIZE))) throw invalid();
  if (!hasUnique(scores, weeklyScoreKey) || !scores.every(({ roundId, monitorId, mask }) =>
    monitorById.has(monitorId) && isFixed(roundById.get(roundId)?.status) &&
    Number.isInteger(mask) && mask >= 0 && mask < 2 ** CONTRIBUTIONS.length)) throw invalid();

  return { format: LOCAL_FORMAT, version: 2, sections, players, monitors, rounds, rosterSize, rosters, roundRosters, scores };
}

function saveLocalEntry(rows, entry, key) {
  const index = rows.findIndex((row) => key(row) === key(entry));
  if (index === -1) rows.push(entry);
  else rows[index] = entry;
}

function addLocalId(rows) {
  const id = rows.reduce((highest, row) => Math.max(highest, row.id), 0) + 1;
  if (!validLocalId(id)) throw localError("La copia no admite más registros.");
  return id;
}

function addMonitorTo(snapshot, name, sectionId, marketValueCents) {
  if (snapshot.monitors.some((monitor) => monitor.sectionId === sectionId && localKey(monitor.name) === localKey(name))) {
    return false;
  }
  snapshot.monitors.push({ id: addLocalId(snapshot.monitors), name, sectionId, marketValueCents });
  return true;
}

function monitorRegisterRows(snapshot) {
  const sections = new Map(snapshot.sections.map(({ id, name }) => [id, name]));
  return snapshot.monitors.map(({ name, sectionId, marketValueCents }) =>
    ({ name, section: sections.get(sectionId), marketValueCents }));
}

function readMonitorRegister(serialized) {
  const invalid = () => localError("Elige un registro de monitores o una copia válida de FantasyScout.");
  let copy;
  try {
    copy = JSON.parse(serialized);
  } catch {
    throw invalid();
  }
  if (copy?.format === LOCAL_FORMAT) return monitorRegisterRows(normalizeCopy(serialized));
  if (copy?.format !== MONITOR_REGISTER_FORMAT || copy.version !== 1 ||
      !Array.isArray(copy.monitors) || copy.monitors.some((row) => !row || typeof row !== "object")) {
    throw invalid();
  }
  return copy.monitors.map(({ name, section, marketValueCents = DEFAULT_MARKET_VALUE_CENTS }) => {
    if (!validMarketValue(marketValueCents)) throw invalid();
    return {
      name: localText(name, "el nombre del monitor", 60),
      section: localText(section, "el nombre de la sección", 60),
      marketValueCents,
    };
  });
}

function createOfflineLeague({ storage = null, locks = null } = {}) {
  let activeView = null;
  let data = newLocalLeague();
  let lastStored = null;
  let warning = storage ? "" : UNSAVED;

  function read() {
    if (!storage) return data;
    let stored;
    try {
      stored = storage.getItem(LOCAL_KEY);
    } catch {
      storage = null;
      warning = UNSAVED;
      return data;
    }
    if (stored === lastStored) return data;
    lastStored = stored;
    try {
      data = stored === null ? newLocalLeague() : normalizeCopy(stored);
      warning = "";
    } catch {
      warning = UNREADABLE;
    }
    return data;
  }

  function write(next) {
    data = next;
    if (!storage) return;
    const serialized = JSON.stringify(next);
    try {
      storage.setItem(LOCAL_KEY, serialized);
      if (storage.getItem(LOCAL_KEY) !== serialized) throw new Error("No se pudo verificar el guardado.");
      lastStored = serialized;
      warning = "";
    } catch {
      storage = null;
      warning = UNSAVED;
    }
  }

  function actorFor(snapshot) {
    return snapshot.players.find(({ id }) => id === activeView) ?? null;
  }

  function stateFor() {
    const snapshot = read();
    const actor = actorFor(snapshot);
    const isPreview = activeView === "preview";
    return {
      ...leagueView(snapshot, { isAdmin: !actor && !isPreview, isPreview, playerId: actor?.id ?? null }),
      storageWarning: warning,
    };
  }

  function edit(path, method, body, draft, actor) {
    const route = path.split("/").slice(2);
    const lookupPlayer = (id) => draft.players.find((player) => player.id === id);
    const lookupSection = (id) => draft.sections.find((section) => section.id === id);
    const lookupRound = (id) => {
      const round = draft.rounds.find((entry) => entry.id === id);
      if (!round) throw localError("La semana no existe.", 404);
      return round;
    };

    if (route[0] === "admin") {
      if (actor) throw localError("Selecciona la vista Organización para hacer este cambio.", 403);
      const id = Number(route[2]);
      if (route[1] === "players" && method === "POST") {
        const alias = localText(body.alias, "el alias", 32);
        const team = localText(body.team, "el nombre del equipo", 52);
        if (!lookupSection(body.sectionId)) throw localError("Elige una sección de la liga.");
        if (draft.players.some((player) => localKey(player.alias) === localKey(alias))) {
          throw localError("Ese alias ya está inscrito. Prueba con otro.", 409);
        }
        draft.players.push({ id: addLocalId(draft.players), alias, team, sectionId: body.sectionId });
        return;
      }
      if (route[1] === "sections" && ["POST", "PATCH"].includes(method)) {
        const section = method === "PATCH" ? lookupSection(id) : null;
        if (method === "PATCH" && !section) throw localError("La sección no existe.", 404);
        const name = localText(body.name ?? section?.name, "el nombre de la sección", 60);
        if (draft.sections.some((entry) => entry.id !== section?.id && localKey(entry.name) === localKey(name))) {
          throw localError("Esa sección ya está inscrita.", 409);
        }
        const reviewerId = body.reviewerId === undefined ? section?.reviewerId ?? null : body.reviewerId;
        if (reviewerId !== null && (!section || lookupPlayer(reviewerId)?.sectionId !== section.id)) {
          throw localError("Elige a un mánager de esta sección.");
        }
        if (section) Object.assign(section, { name, reviewerId });
        else draft.sections.push({ id: addLocalId(draft.sections), name, reviewerId });
        return;
      }
      if (route[1] === "monitors" && method === "POST") {
        const name = localText(body.name, "el nombre del monitor", 60);
        const { sectionId, marketValueCents = DEFAULT_MARKET_VALUE_CENTS } = body;
        if (!lookupSection(sectionId)) throw localError("Elige una sección de la liga.");
        if (!validMarketValue(marketValueCents)) throw localError(MARKET_VALUE_ERROR);
        if (!addMonitorTo(draft, name, sectionId, marketValueCents)) {
          throw localError("Ese monitor ya está registrado en esta sección.", 409);
        }
        return;
      }
      if (route[1] === "monitors" && method === "PATCH") {
        const monitor = draft.monitors.find((entry) => entry.id === id);
        if (!monitor) throw localError("El monitor no existe.", 404);
        if (!validMarketValue(body.marketValueCents)) throw localError(MARKET_VALUE_ERROR);
        monitor.marketValueCents = body.marketValueCents;
        return;
      }
      if (route[1] === "settings" && method === "PATCH") {
        const size = body.rosterSize;
        if (!validRosterSize(size)) throw localError(`Elige un límite entre 1 y ${MAX_ROSTER_SIZE} monitores.`);
        if (draft.rosters.some(({ monitorIds }) => monitorIds.length > size)) {
          throw localError("Reduce las plantillas que superen el nuevo límite antes de guardarlo.", 409);
        }
        draft.rosterSize = size;
        return;
      }
      if (route[1] === "rounds" && method === "POST") {
        const challenge = localText(body.challenge ?? "", "el reto", 280, true);
        const date = localDate(body.date ?? null);
        draft.rounds.push({ id: addLocalId(draft.rounds), challenge, date, status: "planned" });
        return;
      }
      if (route[1] === "rounds" && method === "PATCH") {
        const round = lookupRound(id);
        if ("challenge" in body) round.challenge = localText(body.challenge, "el reto", 280, true);
        if ("date" in body) round.date = localDate(body.date);
        if ("action" in body) {
          const status = nextRoundStatus(round.status, body.action);
          if (!status) throw localError("La semana cambió de estado. Actualiza la página.", 409);
          if (round.status === "open" && status === "scoring") {
            for (const { playerId, monitorIds } of draft.rosters) {
              draft.roundRosters.push({ roundId: round.id, playerId, monitorIds: [...monitorIds] });
            }
          }
          round.status = status;
        }
        return;
      }
    }

    if (route[0] === "roster" && ["PUT", "PATCH"].includes(method)) {
      if (!actor) throw localError("Selecciona la vista de un mánager para guardar su plantilla.", 403);
      const currentIds = draft.rosters.find(({ playerId }) => playerId === actor.id)?.monitorIds ?? [];
      const { monitorIds, problem } = method === "PATCH"
        ? rosterAfterTransfer(currentIds, draft.monitors, draft.rosterSize, body.monitorId, body.action)
        : { monitorIds: body.monitorIds, problem: rosterProblem(body.monitorIds, draft.monitors, draft.rosterSize) };
      if (problem) throw localError(problem);
      saveLocalEntry(draft.rosters, { playerId: actor.id, monitorIds: [...monitorIds] }, ({ playerId }) => playerId);
      return;
    }

    if (route[0] === "rounds" && route[2] === "scores" && method === "PUT") {
      const round = lookupRound(Number(route[1]));
      const target = draft.monitors.find(({ id }) => id === Number(route[3]));
      if (!target) throw localError("El monitor no existe.", 404);
      if (actor && lookupSection(target.sectionId)?.reviewerId !== actor.id) {
        throw localError("Solo puedes puntuar en la sección que tienes asignada.", 403);
      }
      if (round.status !== "scoring") throw localError("La semana debe estar en fase de puntuación.", 409);
      const mask = contributionMask(body.categories);
      if (mask === null) throw localError("Revisa las aportaciones seleccionadas.");
      const note = localText(body.note ?? "", "la nota de aportaciones", 280, true);
      saveLocalEntry(draft.scores, { roundId: round.id, monitorId: target.id, mask, note }, weeklyScoreKey);
      return;
    }
    throw localError("Acción no disponible en la liga local.", 404);
  }

  async function serializedWrite(work) {
    function apply() {
      if (activeView === "preview") throw localError("Elige Organización o un mánager para hacer cambios.", 403);
      return work();
    }
    if (!locks?.request) return apply();
    let acquired = false;
    try {
      return await locks.request(LOCAL_KEY, () => {
        acquired = true;
        return apply();
      });
    } catch (error) {
      if (acquired) throw error;
      return apply();
    }
  }

  return {
    async request(path, method, body) {
      if (path === "/api/state" && method === "GET") return stateFor();
      await serializedWrite(() => {
        const draft = JSON.parse(JSON.stringify(read()));
        edit(path, method, body, draft, actorFor(draft));
        write(draft);
      });
      return { ok: true };
    },
    viewAs(view) {
      if (view !== null && view !== "preview" && !read().players.some(({ id }) => id === view)) {
        throw localError("Elige un mánager inscrito.");
      }

    },
    exportBackup() {

    },
    exportMonitorRegister() {

        format: MONITOR_REGISTER_FORMAT, version: 1, monitors: monitorRegisterRows(read()),
      }, null, 2);
    },
    async importMonitorRegister(serialized) {
      const entries = readMonitorRegister(serialized);
      return serializedWrite(() => {
        const draft = JSON.parse(JSON.stringify(read()));
        if (actorFor(draft)) throw localError("Selecciona la vista Organización para importar el registro.", 403);
        const sections = new Map(draft.sections.map(({ name, id }) => [localKey(name), id]));

          const sectionKey = localKey(section);

          if (!sectionId) {
            sectionId = addLocalId(draft.sections);
            draft.sections.push({ id: sectionId, name: section, reviewerId: null });
            sections.set(sectionKey, sectionId);
          }
          if (addMonitorTo(draft, name, sectionId, marketValueCents)) added++;
        }
        if (added) write(draft);
        return added;
      });
    },
    async importBackup(serialized) {
      const next = normalizeCopy(serialized);
      await serializedWrite(() => write(next));
      activeView = null;
    },
  };
}

async function request(path, method = "GET", body) {
  if (localLeague) return localLeague.request(path, method, body);
  const response = await fetch(path, {
    method,
    headers: body === undefined ? undefined : { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await response.json().catch(() => null);
  if (!response.ok || !data) {
    const error = new Error(data?.error ?? "No se pudo contactar con la liga. Inténtalo de nuevo.");
    error.status = response.status;
    throw error;
  }
  return data;
}

function marketValueDecimal(cents) {
  const digits = String(cents).padStart(3, "0");
  return `${digits.slice(0, -2)}.${digits.slice(-2)}`;
}

function marketValueField(id, cents) {
  const value = marketValueDecimal(cents).replace(/\.00$/, "").replace(".", ",");
  return `<div class="field"><label for="${id}">Valor de mercado (€)</label>
    <input id="${id}" name="marketValue" inputmode="decimal" value="${value}" autocomplete="off" required>
  </div>`;
}

function parseMarketValue(euros) {
  const text = euros.trim();
  const amount = /^\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?$/.test(text) ? text.replaceAll(".", "") : text;
  const parts = /^(\d+)(?:[.,](\d{1,2}))?$/.exec(amount);
  const cents = parts && Number(parts[1] + (parts[2] ?? "").padEnd(2, "0"));
  if (!Number.isSafeInteger(cents)) {
    throw new Error("Introduce un valor en euros igual o superior a cero, con hasta dos decimales.");
  }
  return cents;
}

function lineupPitch(members, capacity, scoreRound) {
  const scores = new Map(state.monitorPoints.filter(({ roundId }) => roundId === scoreRound?.id)
    .map(({ monitorId, points }) => [monitorId, points]));
  const slots = Array.from({ length: capacity }, (_, index) => members[index]);
  const rows = [];
  const rowSize = capacity <= 6 ? 2 : 4;
  if (capacity >= 3 && capacity <= 12) rows.push(slots.splice(0, 1));
  while (slots.length) rows.push(slots.splice(0, rowSize));

  return `<section class="lineup-pitch" aria-label="Alineación en el campo">
    <div class="pitch-lines" aria-hidden="true"><span class="pitch-area top"></span>
      <span class="pitch-middle"></span><span class="pitch-area bottom"></span></div>
    ${rows.map((row) => `<ul class="pitch-row">${row.map((monitor) => {
      if (!monitor) return '<li class="pitch-slot vacant"><span aria-hidden="true">+</span><small>Libre</small></li>';
      const points = scores.get(monitor.id) ?? (scoreRound?.status === "closed" ? 0 : undefined);
      return `<li class="pitch-slot">
        <div class="pitch-avatar"><span aria-hidden="true">${h(initials(monitor.name))}</span>
          ${points === undefined ? "" : `<small class="pitch-score">${points} pt</small>`}
        </div>
        <strong class="pitch-name" title="${h(monitor.name)}">${h(monitor.name)}</strong>
      </li>`;
    }).join("")}</ul>`).join("")}
    ${capacity ? "" : '<p class="pitch-empty">La plantilla de esta semana está vacía.</p>'}
  </section>`;
}

function marketResults() {
  const query = searchName(marketQuery.trim());
  const monitors = state.monitors.filter(({ name, sectionId }) =>
    (!marketSection || sectionId === marketSection) && searchName(name).includes(query));
  if (!monitors.length) return '<p class="empty" role="status">Ningún monitor coincide con la búsqueda.</p>';

  const week = lastScoredRound();
  const weekLabel = week ? `Semana ${week.id}` : "Última semana";
  const weekly = new Map();
  const totals = new Map();
  for (const { roundId, monitorId, points } of state.monitorPoints) {
    if (roundId === week?.id) weekly.set(monitorId, points);
    totals.set(monitorId, (totals.get(monitorId) ?? 0) + points);
  }
  const total = (id) => totals.get(id) ?? 0;
  monitors.sort((a, b) => total(b.id) - total(a.id) || a.name.localeCompare(b.name, "es"));
  const roster = new Set(state.roster);
  const full = roster.size >= state.rosterSize;
  const showActions = Boolean(me());

  return `<div class="table-wrap" tabindex="0" role="region" aria-label="Monitores del mercado">

    </tr></thead><tbody role="rowgroup">${monitors.map(({ id, name, sectionId, marketValueCents }) => {
      const points = weekly.get(id) ?? (week?.status === "closed" ? 0 : undefined);
      const signed = roster.has(id);
      const label = signed ? "Liberar" : "Fichar";
      return `<tr role="row"${signed ? ' class="active-row"' : ""}>
        <th scope="row" role="rowheader" class="market-monitor">${personLine(name, sectionName(sectionId))}</th>
        <td role="cell" class="num market-value">${euro.format(marketValueDecimal(marketValueCents))}</td>
        <td role="cell" class="num market-week"><span class="market-mobile-label" aria-hidden="true">${weekLabel}</span>
          ${points === undefined ? "—" : `${points} pt`}</td>
        <td role="cell" class="num points market-total"><span class="market-mobile-label" aria-hidden="true">Total</span>${total(id)} pt</td>
        ${showActions ? `<td role="cell" class="market-action">

function manageScores() {
  const sections = state.sections.filter(({ id }) => state.viewer.reviewIds.includes(id));

  const members = state.monitors.filter(({ sectionId }) =>
    state.viewer.reviewIds.includes(sectionId) && (!reviewSection || reviewSection === sectionId));
  const target = members.find(({ id }) => id === reviewMonitor) ?? members[0];
  const scores = new Map(state.reviewScores.filter(({ roundId }) => roundId === round.id).map((score) => [score.monitorId, score]));
  const saved = target ? scores.get(target.id) : null;
  const enabled = round.status === "scoring";
  const number = members.filter(({ id }) => scores.has(id)).length;
  const total = state.contributions.reduce((points, { points: value }, index) =>
    points + (saved?.mask & (1 << index) ? value : 0), 0);

  return `<div class="manage-grid">
    <section class="card">
      <div class="card-head"><h2>Semana y sección</h2>${roundStatus(round)}</div>
      ${roundSelect("review-round", round.id)}

      <div class="field"><label for="review-monitor">Monitor</label><select id="review-monitor" data-select="review-monitor"${target ? "" : " disabled"}>

      ${target ? `<form class="form" data-form="score" data-id="${round.id}" data-monitor="${target.id}">
        ${enabled ? "" : '<p class="hint">La organización puede iniciar la puntuación desde Semanas.</p>'}
        <ul class="checklist">${state.contributions.map(({ id, label, description, points }, index) => `<li><label class="check-row">
          <input type="checkbox" name="category" value="${id}" data-value="${points}"${saved?.mask & (1 << index) ? " checked" : ""}${enabled ? "" : " disabled"}>
          <span><strong>${label}</strong><small>${description}</small></span><span class="points">+${points}</span>
        </label></li>`).join("")}</ul>
        <div class="field"><label for="score-note">Nota de aportaciones</label><textarea id="score-note" name="note" maxlength="280" placeholder="Opcional"${enabled ? "" : " disabled"}>${h(saved?.note)}</textarea></div>
        ${errorRegion}<button class="button primary" type="submit"${enabled ? "" : " disabled"}>Guardar puntuación</button>

function render() {
  if (!state.viewer) {
    app.innerHTML = authScreen();
    return;
  }
  const requested = location.hash.slice(1);
  const target = requested === "main" ? currentRoute : requested;
  const tabs = navigation();
  currentRoute = tabs.includes(target) || (target === "gestion" && canReview()) ? target : tabs[0];
  if (currentRoute !== "alineacion") lineupEditing = false;
  const pages = {
    inicio: home, alineacion: lineupPage, mercado: marketPage, clasificacion: standingsPage, jornadas: roundsPage,
    monitores: monitorRegisterPage, gestion: managementPage,
  };
  const storageWarning = state.storageWarning ? `<p class="local-warning" role="status">${h(state.storageWarning)}</p>` : "";
  const content = `${topBar()}<main class="workspace" id="main" tabindex="-1">${storageWarning}${pages[currentRoute]()}</main>`;
  app.innerHTML = isAdmin() ? `${content}<footer class="footer">Grupo Scout Ciudad del Sol 108</footer>`
    : `<div class="manager-view">${content}</div>`;
}

async function start() {
  try {
    await reload();
    render();
  } catch {
    app.innerHTML = '<main class="loading" id="main" tabindex="-1"><h1>FantasyScout</h1><p>No se pudo cargar la liga.</p><button class="button primary" data-command="refresh">Volver a intentar</button></main>';
  }
}

function resetRoute() {
  currentRoute = navigation()[0];
  authMode = "login";
  manageTab = "rounds";
  setupRound = reviewRound = reviewMonitor = undefined;
  lineupRound = 0;
  lineupEditing = false;
  reviewSection = 0;
  marketQuery = "";
  marketSection = 0;
  history.replaceState(null, "", `#${currentRoute}`);
}

const actions = {
  login: ({ alias, password }) => ["/api/login", "POST", { alias, password }],
  "admin-login": ({ password }) => ["/api/login", "POST", { role: "admin", password }],
  register: (values) => ["/api/register", "POST", { ...values, sectionId: Number(values.sectionId) }, "Equipo inscrito."],
  "market-transfer": (_, { dataset }) => ["/api/roster", "PATCH",
    { monitorId: Number(dataset.id), action: dataset.move }, dataset.move === "sign" ? "Monitor fichado." : "Plaza liberada."],
  round: (values, form) => [`/api/admin/rounds/${form.dataset.id}`, "PATCH", values, "Calendario guardado."],
  "add-round": (values) => ["/api/admin/rounds", "POST", values, "Semana añadida."],
  phase: (_, form) => [`/api/admin/rounds/${form.dataset.id}`, "PATCH", { action: form.dataset.action }, "Fase actualizada."],
  "add-player": ({ alias, team, sectionId }) => ["/api/admin/players", "POST", { alias, team, sectionId: Number(sectionId) }, "Equipo inscrito."],
  "add-monitor": ({ name, sectionId, marketValue }) => ["/api/admin/monitors", "POST",
    { name, sectionId: Number(sectionId), marketValueCents: parseMarketValue(marketValue) }, "Monitor registrado."],
  "edit-monitor-value": ({ marketValue }, form) => [`/api/admin/monitors/${form.dataset.id}`, "PATCH",
    { marketValueCents: parseMarketValue(marketValue) }, "Valor de mercado guardado."],
  settings: ({ rosterSize }) => ["/api/admin/settings", "PATCH", { rosterSize: Number(rosterSize) }, "Límite actualizado."],
  "add-section": (values) => ["/api/admin/sections", "POST", values, "Sección añadida."],
  "edit-section": ({ name, reviewerId }, form) => [`/api/admin/sections/${form.dataset.id}`, "PATCH",
    { name, reviewerId: reviewerId ? Number(reviewerId) : null }, "Sección guardada."],
  score: ({ note }, form, data) => [`/api/rounds/${form.dataset.id}/scores/${form.dataset.monitor}`, "PUT",
    { categories: data.getAll("category"), note }, "Puntuación guardada."],
};

async function saveForm(form, button) {
  const formName = form.dataset.form;
  const action = actions[formName];
  const importing = localLeague && ["import-backup", "import-monitors"].includes(formName);
  if ((!action && !importing) || saving) return;
  const errorBox = form.querySelector("[data-error]");
  if (!form.reportValidity()) {
    const label = form.querySelector(":invalid")?.labels?.[0]?.textContent.trim();
    errorBox.textContent = label ? `Revisa el campo «${label}».` : "Revisa los campos del formulario.";
    errorBox.hidden = false;
    return;
  }
  saving = button.disabled = true;
  errorBox.hidden = true;
  try {
    const data = new FormData(form);
    let message;
    if (importing) {
      const copy = data.get("copy");
      if (!copy?.size || copy.size > 2 * 1024 * 1024) throw new Error("Elige una copia JSON de hasta 2 MB.");
      const contents = await copy.text();
      if (formName === "import-monitors") {
        const added = await localLeague.importMonitorRegister(contents);
        message = added === 1 ? "1 monitor añadido." : `${added} monitores añadidos.`;
      } else {
        await localLeague.importBackup(contents);
        message = "Copia cargada.";
      }
    } else {
      const [path, method, body, feedback] = action(Object.fromEntries(data), form, data);
      await request(path, method, body);
      message = feedback;
    }
    await reload();
    if (formName === "add-monitor" && state.storageWarning) message = "Monitor añadido a esta sesión. Descarga el registro para conservarlo.";
    if (formName === "edit-monitor-value" && state.storageWarning) {
      message = "Valor actualizado en esta sesión. Descarga el registro para conservarlo.";
    }
    if (["login", "admin-login", "register"].includes(formName)) resetRoute();
    render();
    if (formName === "add-monitor" && currentRoute === "monitores") {
      document.getElementById("monitor-name")?.focus({ preventScroll: true });
    }
    if (formName === "edit-monitor-value" && currentRoute === "monitores") {
      document.getElementById(`edit-monitor-${form.dataset.id}`)?.focus({ preventScroll: true });
    }
    if (formName === "market-transfer" && currentRoute === "alineacion") {
      const next = document.getElementById(`market-action-${form.dataset.id}`);
      (next?.disabled ? document.getElementById("market-search") : next)?.focus({ preventScroll: true });
    }
    if (message) alertUser(message);
  } catch (error) {
    if (error.status === 401 && state.viewer) {
      await start();
      alertUser(error.message, true);
    } else if (form.isConnected) {
      errorBox.textContent = error.message;
      errorBox.hidden = false;
    } else {
      alertUser(error.message, true);
    }
  } finally {
    saving = button.disabled = false;
  }
}

app.addEventListener("submit", (event) => {
  const form = event.target;
  if (!form.dataset.form) return;
  event.preventDefault();
  const button = event.submitter ?? form.querySelector('button[type="submit"]');
  if (button) void saveForm(form, button);
});

app.addEventListener("keydown", (event) => {
  if (!localLeague || event.key !== "Enter" || event.isComposing || event.repeat) return;
  const input = event.target;
  if (input.tagName !== "INPUT" || !["text", "number", "date"].includes(input.type) || !input.form?.dataset.form) return;
  const button = input.form.querySelector('button[type="submit"]');
  if (!button) return;
  event.preventDefault();
  button.click();
});

app.addEventListener("input", (event) => {
  if (event.target.id !== "market-search") return;
  marketQuery = event.target.value;
  document.getElementById("market-results").innerHTML = marketResults();
});

app.addEventListener("change", async (event) => {
  const control = event.target;
  if (control.dataset.select === "local-view" && localLeague) {
    if (saving) {
      control.value = String(localView());
      return;
    }
    saving = control.disabled = true;
    try {
      let view = control.value || null;
      if (view && view !== "preview") view = Number(view);
      localLeague.viewAs(view);
      await reload();
      resetRoute();
      render();
      document.getElementById("local-view")?.focus({ preventScroll: true });
    } catch (error) {
      alertUser(error.message, true);
    } finally {
      saving = control.disabled = false;
    }
    return;
  }
  if (control.name === "category") {
    const points = Array.from(control.form.querySelectorAll('input[name="category"]:checked'))
      .reduce((sum, checked) => sum + Number(checked.dataset.value), 0);
    control.closest("section").querySelector("[data-points]").textContent = `${points} pt`;
    return;
  }
  const value = Number(control.value);
  switch (control.dataset.select) {
    case "market-section":
      marketSection = value;
      document.getElementById("market-results").innerHTML = marketResults();
      return;
    case "lineup-round": lineupRound = value; break;
    case "setup-round": setupRound = value; break;
    case "review-round": reviewRound = value; break;
    case "review-section": reviewSection = value; reviewMonitor = undefined; break;
    case "review-monitor": reviewMonitor = value; break;
    default: return;
  }
  render();
  document.getElementById(control.id)?.focus({ preventScroll: true });
});

function downloadJson(contents, name) {
  const url = URL.createObjectURL(new Blob([contents], { type: "application/json" }));
  const link = document.createElement("a");
  link.href = url;
  link.download = name;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

app.addEventListener("click", async (event) => {
  const control = event.target.closest("button, a");
  if (!control) return;
  if (localLeague && control.type === "submit" && control.form?.dataset.form) {
    event.preventDefault();
    await saveForm(control.form, control);
    return;
  }
  if (control.hasAttribute("data-route")) {
    if (control.dataset.panel) manageTab = control.dataset.panel;
    if (control.getAttribute("href") === location.hash) render();
  } else if (control.dataset.auth) {
    authMode = control.dataset.auth;
    render();
    app.querySelector("input")?.focus();
  } else if (control.dataset.manage) {
    manageTab = control.dataset.manage;
    render();
    app.querySelector('[data-manage][aria-pressed="true"]')?.focus({ preventScroll: true });
  } else if (control.dataset.command === "edit-lineup" && me() && !saving) {
    lineupEditing = !lineupEditing;
    if (lineupEditing) lineupRound = 0;
    render();
    document.getElementById("lineup-edit")?.focus({ preventScroll: true });
  } else if (control.dataset.command && !saving) {
    saving = control.disabled = true;
    try {
      if (control.dataset.command === "export-backup" && localLeague) {
        downloadJson(localLeague.exportBackup(), "fantasyscout-108-copia.json");
        return;
      }
      if (control.dataset.command === "export-monitors" && localLeague) {
        downloadJson(localLeague.exportMonitorRegister(), "fantasyscout-monitores.json");
        return;
      }
      if (control.dataset.command === "logout") {
        await request("/api/logout", "POST", {});
        resetRoute();
      }
      await reload();
      render();
    } catch (error) {
      alertUser(error.message, true);
    } finally {
      saving = control.disabled = false;
    }
  }
});

window.addEventListener("hashchange", () => {
  if (state?.viewer && location.hash !== "#main") {
    render();
    document.querySelector("#main")?.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }
});

start();

})();
</script>
